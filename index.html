    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0c10;

            margin: 0; 
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Fixed Width Sidebar */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #1f2833;
            border-right: 2px solid #45f3ff;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #2a3542;
            text-align: center;
        }

        .sidebar-header h1 {
            color: #66fcf1;
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }

        .btn-cloak {
            background: #ff007f;
            color: white;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        #searchBar {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 20px;
            border: 2px solid #45f3ff;
            background: #0b0c10;
            color: white;
            outline: none;
        }

        .game-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .category-title {
            color: #45f3ff;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 5px 5px;
            font-weight: bold;
        }

        .game-btn {
            background: #2a3542;
            color: #ffffff;
            border: 1px solid #121212;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-btn:hover {
            background: #45f3ff;
            color: #0b0c10;
            font-weight: bold;
        }

        /* Core Game Screen Player Window */
        .main-content {
            flex: 1;
            height: 100%;
            background: #0b0c10;
            display: flex;
            flex-direction: column;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #45f3ff;
            padding: 20px;
            text-align: center;
        }

        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: none;
        }
    </style>
</head>
