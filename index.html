<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Arcade</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00ffcc; font-size: 2.5rem; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        p { color: #aaaaaa; }
        .arcade-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 30px; }
        .game-card { background: #252525; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 90%; max-width: 850px; }
        .game-frame { width: 100%; height: 550px; border: 3px solid #333; border-radius: 8px; background: #000; }
    </style>
</head>
<body>

    <h1>🎮 My Chromebook Arcade 🕹️</h1>
    <p>Type my custom URL into your browser bar to play anytime!</p>

    <div class="arcade-container">
        <!-- GAME 1 -->
        <div class="game-card">
            <h2>Space Huggers (Retro Shooter)</h2>
            <!-- This loads a completely free, unblocked web game safely -->
            <iframe class="game-frame" src="https://github.io"></iframe>
        </div>
    </div>

</body>
</html>
